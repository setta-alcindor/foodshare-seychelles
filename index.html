<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare Seychelles</title>
    
    <link rel="icon" type="image/png" href="YOUR_DIRECT_FAVICON_LINK.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex flex-col min-h-screen">

    <nav class="bg-white flex items-center justify-between p-6 shadow-sm z-10 relative">
        <a href="/">
            <img 
                src="YOUR_DIRECT_LOGO_LINK.png" 
                alt="FoodShare Seychelles Logo" 
                class="h-12 w-auto"
            />
        </a>
        
        <div class="space-x-6 font-medium hidden md:block">
            <a href="/about/" class="text-gray-600 hover:text-green-600 transition">About Us</a>
            <a href="/find-food/" class="text-gray-600 hover:text-green-600 transition">Find Food</a>
            <a href="/donate/" class="text-gray-600 hover:text-green-600 transition">Donate</a>
            <a href="/contact/" class="text-gray-600 hover:text-green-600 transition">Contact</a>
            <a href="/login/" class="px-5 py-2.5 bg-green-600 text-white rounded-md hover:bg-green-700 transition">Login</a>
        </div>
    </nav>

    <header class="w-full h-[60vh] bg-black">
        <img 
            src="https://i.ibb.co/Gfp5TMhD/header-bg.jpg" 
            alt="FoodShare Seychelles Community"
            class="w-full h-full object-cover"
            onerror="this.src='https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&q=80';"
            />
    </header>

    <main class="flex-grow py-16 px-6">
        <div class="max-w-6xl mx-auto text-center">
            <h2 class="text-3xl font-bold mb-10 text-gray-800">Our Impact in Seychelles</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-100">
                    <h3 id="stat-meals" class="text-5xl font-extrabold text-green-600 mb-2">...</h3>
                    <p class="text-gray-500 uppercase tracking-wide text-sm font-semibold">Meals Shared</p>
                </div>

                <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-100">
                    <h3 id="stat-volunteers" class="text-5xl font-extrabold text-green-600 mb-2">...</h3>
                    <p class="text-gray-500 uppercase tracking-wide text-sm font-semibold">Active Volunteers</p>
                </div>

                <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-100">
                    <h3 id="stat-pounds" class="text-5xl font-extrabold text-green-600 mb-2">...</h3>
                    <p class="text-gray-500 uppercase tracking-wide text-sm font-semibold">Lbs of Food Saved</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-8 text-center">
        <p class="text-gray-400 text-sm">&copy; 2026 FoodShare Seychelles. All rights reserved.</p>
        <div class="mt-4 space-x-4 text-sm text-gray-500">
            <a href="/legal/terms/" class="hover:text-white">Terms of Service</a>
            <a href="/legal/privacy/" class="hover:text-white">Privacy Policy</a>
        </div>
    </footer>

    <script>
        // Initialize Supabase with your provided credentials
        const _supabase = supabase.createClient(
            'https://vwngymlkjyamueyjdico.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bmd5bWxranlhbXVleWpkaWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDY5MTIsImV4cCI6MjA5NDU4MjkxMn0.Lhb7bYTDC-aRnNhdXInMgt6WkMTHGCV64q5TfYI-zXM'
        );

        // Fetch the stats when the page loads
        async function fetchImpactStats() {
            try {
                const { data, error } = await _supabase
                    .from('impact_stats')
                    .select('meals_shared, active_volunteers, pounds_saved')
                    .eq('id', 1)
                    .single();

                if (error) throw error;

                if (data) {
                    // Update the HTML with the live data from your database
                    document.getElementById('stat-meals').innerText = data.meals_shared.toLocaleString();
                    document.getElementById('stat-volunteers').innerText = data.active_volunteers.toLocaleString();
                    document.getElementById('stat-pounds').innerText = data.pounds_saved.toLocaleString();
                }
            } catch (error) {
                console.error('Error fetching stats:', error.message);
                // Fallback text if the database connection fails
                document.getElementById('stat-meals').innerText = "0";
                document.getElementById('stat-volunteers').innerText = "0";
                document.getElementById('stat-pounds').innerText = "0";
            }
        }

        // Run the function
        fetchImpactStats();
    </script>
</body>
</html>
